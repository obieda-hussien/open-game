version: 2.1

executors:
  android-machine:
    machine:
      image: android:current
    resource_class: medium.gen2

commands:
  install-godot:
    steps:
      - run:
          name: Install Godot 4.7.2 and export templates
          command: |
            set -euo pipefail
            GODOT_VERSION="4.7.2"
            GODOT_CHANNEL="stable"
            VERSION="${GODOT_VERSION}-${GODOT_CHANNEL}"
            RELEASE_BASE="https://github.com/godotengine/godot-builds/releases/download/${VERSION}"
            TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"

            if [ ! -x "$HOME/.local/bin/godot" ]; then
              mkdir -p "$HOME/.local/bin"
              curl --fail --location --retry 3 \
                "${RELEASE_BASE}/Godot_v${VERSION}_linux.x86_64.zip" \
                --output /tmp/godot.zip
              unzip -q /tmp/godot.zip -d /tmp/godot
              GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v*linux.x86_64*' | head -n1)"
              install -m 0755 "$GODOT_BIN" "$HOME/.local/bin/godot"
            fi

            if [ ! -f "${TEMPLATE_DIR}/android_debug.apk" ]; then
              mkdir -p "$TEMPLATE_DIR"
              curl --fail --location --retry 3 \
                "${RELEASE_BASE}/Godot_v${VERSION}_export_templates.tpz" \
                --output /tmp/templates.tpz
              rm -rf /tmp/godot-templates
              unzip -q /tmp/templates.tpz -d /tmp/godot-templates
              cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
            fi
            "$HOME/.local/bin/godot" --version

  send-apks-to-telegram:
    steps:
      - run:
          name: Send intact APKs to Telegram
          when: always
          command: |
            set +e
            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
              echo "Telegram variables are not configured; skipping."
              exit 0
            fi

            shopt -s nullglob
            FILES=(build/android/*.apk)
            if [ "${#FILES[@]}" -eq 0 ]; then
              echo "No APKs found."
              exit 0
            fi

            for FILE in "${FILES[@]}"; do
              SIZE="$(wc -c < "$FILE" | tr -d ' ')"
              NAME="$(basename "$FILE")"
              if [ "$SIZE" -gt 50000000 ]; then
                curl --fail-with-body -sS -X POST \
                  "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d chat_id="$TELEGRAM_CHAT_ID" \
                  --data-urlencode "text=⚠️ ${NAME} is ${SIZE} bytes (>50 MB). The APK remains intact in CircleCI artifacts and was not split." \
                  >/dev/null || true
                continue
              fi
              curl --fail-with-body -sS -X POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F chat_id="$TELEGRAM_CHAT_ID" \
                -F document=@"$FILE" \
                -F "caption=Last Shift | ${CIRCLE_BRANCH:-unknown} | build ${CIRCLE_BUILD_NUM:-unknown}" \
                >/dev/null || true
            done

jobs:
  godot-android-ci:
    executor: android-machine
    environment:
      GODOT_VERSION: "4.7.2"
      GODOT_CHANNEL: "stable"
    steps:
      - checkout

      - restore_cache:
          keys:
            - godot-v1-4.7.2
            - godot-v1-

      - install-godot

      - run:
          name: Prepare Android SDK and debug signing
          command: |
            set -euo pipefail
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;35.0.1"

            mkdir -p .ci
            keytool -genkeypair -v \
              -keystore .ci/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Last Shift,C=EG"
            python3 tools/configure_ci_signing.py \
              --debug-keystore .ci/debug.keystore

      - run:
          name: Validate content
          command: python3 tools/validate_content.py

      - run:
          name: Import project and parse scripts
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            godot --headless --path . --editor --quit-after 8

      - run:
          name: Run headless tests
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            godot --headless --path . --script res://tests/test_runner.gd

      - run:
          name: Export Android debug APK
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            mkdir -p build/android
            godot --headless --path . \
              --export-debug "Android Debug" build/android/last-shift-debug.apk
            test -s build/android/last-shift-debug.apk

      - run:
          name: Export signed release APK when configured
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            if [ -z "${ANDROID_RELEASE_KEYSTORE_BASE64:-}" ] || \
               [ -z "${ANDROID_RELEASE_KEYSTORE_USER:-}" ] || \
               [ -z "${ANDROID_RELEASE_KEYSTORE_PASSWORD:-}" ]; then
              echo "Release signing variables are not configured; skipping release export."
              exit 0
            fi
            printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > .ci/release.keystore
            python3 tools/configure_ci_signing.py \
              --release-keystore .ci/release.keystore \
              --release-user "$ANDROID_RELEASE_KEYSTORE_USER" \
              --release-password "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
            godot --headless --path . \
              --export-release "Android Release" build/android/last-shift-release.apk
            test -s build/android/last-shift-release.apk

      - send-apks-to-telegram

      - store_artifacts:
          path: build/android
          destination: android-apks

      - save_cache:
          key: godot-v1-4.7.2
          paths:
            - ~/.local/bin/godot
            - ~/.local/share/godot/export_templates/4.7.2.stable

workflows:
  last-shift-ci:
    jobs:
      - godot-android-ci
